name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then unzip -o "$ZIP" -d src_zip; fi
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::لازم تضيف SIGNING_KEY و SIGNING_PASSWORD بـ Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$SIGNING_KEY" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" SnookerBubble.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnookerBubble-apk
          path: SnookerBubble.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SnookerBubble ${{ github.run_number }}
          files: SnookerBubble.apk
